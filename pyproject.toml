[project]
name = "rag"
version = "0.1.0"
description = "RAG system with MCP, Qdrant and Gemini integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core MCP and LangChain dependencies
    "mcp[cli]>=1.10.1",
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    
    # Vector stores and embeddings
    "chromadb>=1.0.15",
    "langchain-qdrant>=0.1.0",
    "qdrant-client>=1.7.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=2.2.0",
    
    # LLM providers
    "langchain-google-genai>=2.0.0",
    "google-generativeai>=0.3.0",
    "langchain-ollama>=0.3.3",
    
    # Document processing
    "PyPDF2>=3.0.0",
    "pypdf>=3.17.0",
    
    # HTTP clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
    
    # Environment and utilities
    "python-dotenv>=1.0.0",
    "pathlib2>=2.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
