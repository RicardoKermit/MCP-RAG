[project]
name = "rag"
version = "0.1.0"
description = "RAG system with MCP, Qdrant and Gemini integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core MCP and LangChain dependencies
    "mcp[cli]>=1.10.1",
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    # Vector stores and embeddings
    "chromadb>=1.0.15",
    "langchain-qdrant>=0.1.0",
    "qdrant-client>=1.7.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=2.2.0",
    # LLM providers
    "langchain-google-genai>=2.0.0",
    "google-generativeai>=0.3.0",
    "langchain-ollama>=0.3.3",
    # Document processing
    "PyPDF2>=3.0.0",
    "pypdf>=3.17.0",
    # HTTP clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
    # Environment and utilities
    "python-dotenv>=1.0.0",
    "pathlib2>=2.3.7",
    "flask>=3.1.1",
    "flask-socketio>=5.5.1",
    "python-socketio>=5.13.0",
    "python-engineio>=4.12.2",
    "eventlet>=0.40.2",
    "moviepy>=2.2.1",
    "gtts>=2.5.4",
    "pillow>=11.3.0",
    "opencv-python>=4.12.0.88",
    "google-genai>=1.28.0",
    "psycopg2>=2.9.10",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
    "pdfs/*",
    "*.md",
    "*.txt"
]
exclude = [
    "db/*",
    "db_pdf/*",
    "db_pdf_multi/*",
    "rag_files/*",
    "rag_files_original/*",
    "rag_files_refined/*",
    "*.json",
    "*.lock"
]
