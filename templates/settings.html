<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings - Dialogus</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon_white.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
</head>
<body>

  <!-- Main Content -->
  <div class="main-content">
    <div class="main-header">
        
        <button class="stats-toggle" onclick="openStatistics()" id="statsToggle" title="Estatísticas">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3v18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()" id="darkModeToggle" title="Alternar modo escuro">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="dark-mode-toggle" onclick="openHelp()" id="toolspage" title="toolspage">?</button>
        
    </div>
</div>

<div class="settings">
  <div class="model-section">
    <h1 id="modelSectionTitle">🤖 Modelos</h1>
    <div class="model-selector">
      <select id="modelSelect" onchange="changeModel()">
        <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B</option>
        <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.0-pro">Gemini 2.0 Pro</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="gemini-1.0-pro">Gemini 1.0 Pro</option>
        <option value="gemini-pro">Gemini Pro</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        <!-- OpenAI -->
        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="gpt-4o-mini">GPT-4o Mini</option>
        <option value="gpt-4.1">GPT-4.1</option>

        <!-- Ollama -->
        <option value="llama3">LLaMA 3 (8B)</option>
        <option value="llama3-70b">LLaMA 3 (70B)</option>
        <option value="mistral">Mistral 7B</option>
        <option value="codellama">CodeLLaMA</option>
        <option value="gemma">Gemma 7B</option>
      </select>
      <div class="model-info" id="modelInfo">
        <small>Choose the LLM you want to use</small>
      </div>
      <div id="connectionStatus"></div>
    </div>
  </div>

  <div class="language-section">
    <h3>🗄️ RAG Backend</h3>
    <div class="language-selector">
      <select id="ragBackendSelect" onchange="changeRagBackend()">
        <option value="qdrant">Qdrant (Cloud)</option>
        <option value="chroma">Chroma (Local)</option>
      </select>
    </div>
  </div>

  <br>
  <hr>

  <h2>🧠 Instruções para as Tools (Client Side)</h2>
  <p>Prompt 1ª Geração</p>
  <textarea class="settings-textarea" id="toolInstructions"></textarea>
  <p>Prompt 2ª Geração</p>
  <textarea class="settings-textarea" id="toolInstructionsFollow"></textarea>
  <button  onclick="saveInstructions()" class="settingsbtn">💾 Guardar</button>

  <br>
  <hr>
  <h2>⚙️ Configuração das Tools (Server Side)</h2>  

  <div class="server-tools">  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
      <b>Practice Quiz</b>
      </button>
        <div class="tool-content collapsed">
          <div class="tool-row">
            <textarea id="tool_practice_quiz" rows="4" class="settings-textarea"></textarea>
            <button onclick="saveToolInstructions('practice_quiz')" class="save-btn">💾 Guardar</button>
          </div>
        </div>
    </div>

    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Generate Quiz with Difficulty</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_generate_quiz_with_difficulty" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('generate_quiz_with_difficulty')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Recommend Reading Material</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_recommend_reading_material" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('recommend_reading_material')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Generate Dev Questions</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_generate_dev_questions" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('generate_dev_questions')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Study Plan Generator</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_study_plan_generator" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('study_plan_generator')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Generate Lesson Summary</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_generate_lesson_summary" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('generate_lesson_summary')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Interactive Flashcards</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_interactive_flashcards" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('interactive_flashcards')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>
  
    <div class="tool-config">
      <button class="collapse-toggle" onclick="toggleCollapse(this)">
        <b>Generate Test</b>
      </button>
      <div class="tool-content collapsed">
        <div class="tool-row">
          <textarea id="tool_generate_test" rows="4" class="settings-textarea"></textarea>
          <button onclick="saveToolInstructions('generate_test')" class="save-btn">💾 Guardar</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Mantém o JS global -->
  <script  src="{{ url_for('static', filename='js/app.js') }}">
  </script>
</body>
</html>
